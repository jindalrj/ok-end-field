name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          "tag=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          lfs: true
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set UTF-8 encoding
        run: |
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install Tesseract OCR
        run: |
          choco install tesseract --version=5.3.4.20240503 -y --no-progress
          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install polib

      - name: inline_ok_requirements
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ steps.tag.outputs.tag }}

      - name: Run tests
        timeout-minutes: 5
        run: |
          python -u -m unittest discover -s tests -p "Test*.py" -v

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          "tag=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          lfs: true
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set UTF-8 encoding
        run: |
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install Tesseract OCR
        run: |
          choco install tesseract --version=5.3.4.20240503 -y --no-progress
          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install polib

      - name: inline_ok_requirements
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ steps.tag.outputs.tag }}

      - name: Build PyAppify exe only
        id: build-app
        uses: ok-oldking/pyappify-action@master
        with:
          build_exe_only: true

      - name: Package installer (strip .git to reduce size)
        shell: pwsh
        run: |
          $exePath = "${{ steps.build-app.outputs.exe-path }}"
          $exeFolder = "${{ steps.build-app.outputs.exe-folder }}"
          # buildDir is 3 levels up from exe: <buildDir>/src-tauri/target/release/ok-ef.exe
          $buildDir = (Get-Item $exeFolder).Parent.Parent.Parent.FullName
          $tauriDataPath = Join-Path $buildDir "src-tauri\data"
          $distDir = "pyappify_dist"
          $appDistDir = Join-Path $distDir "ok-ef"

          Write-Host "exePath: $exePath"
          Write-Host "buildDir: $buildDir"
          Write-Host "tauriDataPath: $tauriDataPath"

          # Copy exe to dist
          New-Item -ItemType Directory -Force -Path $appDistDir | Out-Null
          $exeDestPath = Join-Path $appDistDir "ok-ef.exe"
          Copy-Item $exePath $exeDestPath

          # Create online installer (empty data)
          if (Test-Path $tauriDataPath) { Remove-Item -Recurse -Force $tauriDataPath }
          New-Item -ItemType Directory -Force -Path $tauriDataPath | Out-Null
          Push-Location $buildDir
          pnpm tauri bundle
          Pop-Location
          $nsisDir = Join-Path $buildDir "src-tauri\target\release\bundle\nsis"
          $onlineInstaller = Get-ChildItem $nsisDir -Filter "*.exe" | Select-Object -First 1
          if ($onlineInstaller) {
            Move-Item $onlineInstaller.FullName (Join-Path $distDir "ok-ef-win32-online-setup.exe")
          }

          # Run setup for Global profile
          & $exeDestPath -c setup -p Global
          $dataPath = Join-Path $appDistDir "data"

          # Remove .git to save ~500MB in final installer
          if (Test-Path $dataPath) {
            Get-ChildItem -Path $dataPath -Directory -Recurse -Filter ".git" | ForEach-Object {
              $size = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB
              Write-Host "Removing $($_.FullName) ($([math]::Round($size, 1)) MB)"
              Remove-Item -Recurse -Force $_.FullName
            }
            # Also remove test images and model training assets that aren't needed at runtime
            @("x-anylabeling-asset", "tests\images") | ForEach-Object {
              $p = Join-Path $dataPath "apps\ok-ef\working\$_"
              if (Test-Path $p) {
                Write-Host "Removing $p"
                Remove-Item -Recurse -Force $p
              }
            }
          }

          # Move cleaned data to tauri and bundle
          if (Test-Path $tauriDataPath) { Remove-Item -Recurse -Force $tauriDataPath }
          Move-Item $dataPath $tauriDataPath

          Push-Location $buildDir
          pnpm tauri bundle
          Pop-Location

          $installer = Get-ChildItem $nsisDir -Filter "*.exe" | Select-Object -First 1
          if ($installer) {
            Move-Item $installer.FullName (Join-Path $distDir "ok-ef-win32-Global-setup.exe")
          }

          # Cleanup data from dist (keep only exe + installers)
          Get-ChildItem $appDistDir | Where-Object { $_.Name -ne "ok-ef.exe" } | Remove-Item -Recurse -Force

      - name: Add version to build filenames
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.tag }}"
          Get-ChildItem -Path pyappify_dist -File | ForEach-Object {
            Rename-Item -LiteralPath $_.FullName -NewName "$($_.BaseName)-$version$($_.Extension)"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyappify_dist-${{ steps.tag.outputs.tag }}
          path: pyappify_dist/*

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: false
          body: |
            English warehouse transfer fix build
          files: pyappify_dist/**
