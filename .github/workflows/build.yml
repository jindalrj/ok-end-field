name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          "tag=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          lfs: true
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set UTF-8 encoding
        run: |
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install Tesseract OCR
        run: |
          choco install tesseract --version=5.3.4.20240503 -y --no-progress
          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install polib

      - name: inline_ok_requirements
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ steps.tag.outputs.tag }}

      - name: Run tests
        timeout-minutes: 5
        run: |
          python -u -m unittest discover -s tests -p "Test*.py" -v

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          "tag=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          lfs: true
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set UTF-8 encoding
        run: |
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install and bundle Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --version=5.3.4.20240503 -y --no-progress
          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Bundle Tesseract into repo so it ships with the exe
          $src = "C:\Program Files\Tesseract-OCR"
          $dst = Join-Path $pwd "tesseract"
          Copy-Item -Path $src -Destination $dst -Recurse -Force
          Write-Host "Bundled Tesseract to $dst ($(Get-ChildItem $dst -Recurse -File | Measure-Object -Property Length -Sum | ForEach-Object { [math]::Round($_.Sum/1MB, 1) }) MB)"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install polib

      - name: inline_ok_requirements
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ steps.tag.outputs.tag }}

      - name: Prepare cache paths
        id: cache-paths
        shell: pwsh
        run: |
          $cargoDir = Join-Path $env:USERPROFILE ".cargo"
          $pnpmStore = Join-Path $env:LOCALAPPDATA "pnpm" "store"
          New-Item -ItemType Directory -Force -Path (Join-Path $cargoDir "registry") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $cargoDir "git") | Out-Null
          New-Item -ItemType Directory -Force -Path $pnpmStore | Out-Null
          "cargo-dir=$cargoDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pnpm-store=$pnpmStore" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.cache-paths.outputs.cargo-dir }}/registry
            ${{ steps.cache-paths.outputs.cargo-dir }}/git
          key: cargo-registry-${{ runner.os }}-pyappify
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.cache-paths.outputs.pnpm-store }}
          key: pnpm-store-${{ runner.os }}-pyappify
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Build with PyAppify Action
        id: build-app
        uses: jindalrj/pyappify-action@master

      - name: Add version to build filenames
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.tag }}"
          Get-ChildItem -Path pyappify_dist -File | ForEach-Object {
            Rename-Item -LiteralPath $_.FullName -NewName "$($_.BaseName)-$version$($_.Extension)"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyappify_dist-${{ steps.tag.outputs.tag }}
          path: pyappify_dist/*

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: false
          body: |
            English warehouse transfer fix build
          files: pyappify_dist/**
